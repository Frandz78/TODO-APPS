<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROJECT TODO APPS</title>

    <!-- Styling -->
    <link rel="stylesheet" href="CSS/style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>Todo List</h1>
    </header>

    <!-- Main -->
    <main>
      <!-- INPUT SECTION -->
      <section class="input_section">
        <!-- form todos -->
        <div class="container">
          <h2>Tambah yang harus di lakukan</h2>
          <form class="form" action="#" id="form">
            <div class="form-group">
              <label for="title">Masukan Judul Kegiatan</label>
              <input type="text" name="title" id="title" required />
            </div>
            <div class="form-group">
              <label for="description">Masukan deskripsi kegiatan</label>
              <textarea name="description" id="description" cols="20" rows="4"></textarea>
            </div>
            <div class="form-group">
              <label for="date">Masukan tanggal harus selesai</label>
              <input type="date" name="date" id="date" required />
            </div>
            <input type="submit" class="btn-submit" value="Simpan" />
          </form>
        </div>
      </section>

      <!-- TODOS SECTION -->
      <section class="todos_section">
        <!-- todos -->
        <div class="container">
          <h2>Yang harus di lakukan</h2>

          <div class="list-item" id="todos">
            <!-- 
              <div class="item">
                  
              <div class="inner">
  
              <h2>judul kegiatan</h2>
              <p>deskripsi kegiatan</p>
              <p>tanggal</p>
              <button class="check-button">tombol cek</button> 
  
              </div>
  
              </div>
              -->
          </div>
        </div>

        <!-- completed todos -->
        <div class="container">
          <h2>Yang sudah di lakukan</h2>

          <div class="list-item" id="completed-todos">
            <!-- 
              <div class="item">
                  
              <div class="inner">
  
              <h2>judul kegiatan</h2>
              <p>deskripsi kegiatan</p>
              <p>tanggal</p>
              <button class="undo-button">tombol undo</button> 
              <button class="trash-button">tombol hapus</button> 
  
              </div>
  
              </div>
              -->
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer></footer>

    <!-- Script JS -->
    <script src="JS/main.js"></script>
  </body>
</html>
